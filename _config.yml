# GitHub Pages: o site é HTML puro, sem processamento.
# Arquivos de configuração do servidor (cPanel/Apache) ficam no repositório,
# mas não são publicados para o público.
# O Jekyll publica o .htaccess por padrão (lista "include"); zerada para ele ficar fora do ar.
include: []
exclude:
  - .htaccess
  - .cpanel.yml
  - .gitignore
  - _guardados
  - "*.md"
