<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://tlixawxfsuwmgjjlcapw.supabase.co https://formsubmit.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; media-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests">
<script src="/seguranca.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YJG6HQJWBZ"></script>
<script src="/gtag-init.js"></script>
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Envio de materiais | Descomplica Site</title>
<meta name="description" content="Envie os arquivos e links do seu projeto para a Descomplica Site.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#02040a">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/hubot-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/mona-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/formulario/formulario.css">
</head>
<body>

<header class="top">
  <a class="top__logo" href="/" aria-label="Descomplica Site">
    <img src="/assets/marca/logo-d-branca.png" alt="" width="32" height="32">
    <span>Descomplica Site</span>
  </a>
  <span class="top__tag">Envio de materiais</span>
</header>

<main class="wrap" id="app">

  <section class="intro" aria-labelledby="t-intro">
    <h1 id="t-intro">Mande seus arquivos <em>por aqui</em></h1>
    <p class="lead">Logo, fotos, vídeos, PDFs, o que tiver. Leva um minuto.</p>
  </section>

  <form class="form" id="briefing" novalidate autocomplete="on">
    <div class="block">
      <div class="row">
        <div class="field">
          <label for="nome">Seu nome <abbr title="obrigatório">*</abbr></label>
          <input id="nome" name="nome" type="text" autocomplete="name" required>
          <p class="err" id="nome-err"></p>
        </div>
        <div class="field">
          <label for="whatsapp">WhatsApp <abbr title="obrigatório">*</abbr></label>
          <input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 98888-7777" required>
          <p class="err" id="whatsapp-err"></p>
        </div>
      </div>

      <div class="drop" data-drop>
        <input id="arquivos" type="file" multiple class="drop__input" aria-describedby="drop-help">
        <label for="arquivos" class="drop__area">
          <svg class="ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M240 136v64a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16v-64a16 16 0 0 1 16-16h48a8 8 0 0 1 0 16H32v64h192v-64h-48a8 8 0 0 1 0-16h48a16 16 0 0 1 16 16ZM85.66 77.66 120 43.31V128a8 8 0 0 0 16 0V43.31l34.34 34.35a8 8 0 0 0 11.32-11.32l-48-48a8 8 0 0 0-11.32 0l-48 48a8 8 0 0 0 11.32 11.32Z"/></svg>
          <span class="drop__title">Toque para escolher os arquivos</span>
          <span class="drop__sub" id="drop-help">Pode escolher vários de uma vez. Até 50 MB cada.</span>
        </label>
      </div>
      <ul class="files" data-files aria-live="polite"></ul>
      <p class="err" id="arquivos-err"></p>

      <details class="more">
        <summary>Tem link do Drive, WeTransfer ou Canva?</summary>
        <div class="field links">
          <label for="link-novo">Cole o link</label>
          <div class="links__add">
            <input id="link-novo" type="url" inputmode="url" placeholder="https://">
            <button type="button" class="btn btn--ghost" data-link-add>Adicionar</button>
          </div>
          <p class="err" id="link-err"></p>
          <ul class="files" data-links aria-live="polite"></ul>
        </div>
      </details>

      <div class="field">
        <label for="obs">Quer deixar um recado? <span class="opt">(opcional)</span></label>
        <textarea id="obs" name="obs" rows="3"></textarea>
      </div>

      <div class="send">
        <button type="submit" class="btn btn--main" data-submit>Enviar arquivos</button>
        <p class="send__status" data-status role="status" aria-live="polite"></p>
      </div>
    </div>
  </form>
</main>

<section class="done" data-done hidden tabindex="-1" aria-labelledby="t-done">
  <div class="done__card">
    <svg class="done__ico" viewBox="0 0 256 256" aria-hidden="true"><path d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"/></svg>
    <h2 id="t-done">Recebi, obrigado!</h2>
    <p>Seu protocolo é <b data-protocolo></b>. Vou olhar o material e te chamo no WhatsApp.</p>
    <a class="btn btn--main" data-wa href="#" target="_blank" rel="noopener">Avisar no WhatsApp</a>
  </div>
</section>

<script src="/formulario/formulario.js" defer></script>
</body>
</html>
